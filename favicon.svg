<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- AMOLED Black Background -->
  <rect width="200" height="200" fill="#000000"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff006e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8338ec;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing Circle Background -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#gradCyan)" stroke-width="2" opacity="0.3" filter="url(#glow)"/>

  <!-- Play Button Icon (Streaming Theme) -->
  <g transform="translate(100, 100)">
    <!-- Outer Circle -->
    <circle cx="0" cy="0" r="60" fill="url(#gradCyan)" opacity="0.9" filter="url(#glow)"/>

    <!-- Inner Play Triangle -->
    <polygon points="0,-25 45,20 0,45" fill="#000000"/>

    <!-- Accent Dots -->
    <circle cx="-35" cy="-35" r="8" fill="url(#gradMagenta)"/>
    <circle cx="35" cy="35" r="8" fill="url(#gradCyan)"/>
  </g>

  <!-- PT Text -->
  <text x="100" y="175" font-family="Inter, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#00d9ff" opacity="0.6">PT</text>
</svg>
